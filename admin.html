<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片审核后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c1c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;min-height:100vh}
h1{font-size:20px;font-weight:600;margin-bottom:20px;color:rgba(255,255,255,.9)}
.login{max-width:320px;margin:80px auto;text-align:center;display:flex;flex-direction:column;gap:12px;padding:24px}
.login input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:14px;padding:10px 14px;outline:none;font-family:inherit;text-align:center}
.login input:focus{border-color:rgba(77,195,247,.5)}
.login button{padding:10px;border:none;border-radius:8px;background:rgba(77,195,247,.25);color:#4fc3f7;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.login button:hover{background:rgba(77,195,247,.4)}

/* ── Layout ── */
.admin-layout{display:flex;height:100vh}
.sidebar{width:240px;min-width:240px;background:rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-header h2{font-size:14px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:10px}
.sidebar-search{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-size:12px;padding:7px 10px;width:100%;outline:none;font-family:inherit}
.sidebar-search:focus{border-color:rgba(77,195,247,.5)}
.sidebar-search::placeholder{color:rgba(255,255,255,.25)}
.sidebar-list{flex:1;overflow-y:auto;padding:6px 0}
.sidebar-list::-webkit-scrollbar{width:4px}
.sidebar-list::-webkit-scrollbar-track{background:transparent}
.sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .12s;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.sidebar-item.active{background:rgba(77,195,247,.1);color:#4fc3f7;border-left-color:#4fc3f7}
.sidebar-item .item-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sidebar-item .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .item-count{font-size:10px;color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);padding:1px 6px;border-radius:8px;flex-shrink:0}
.sidebar-item.active .item-count{color:rgba(77,195,247,.7);background:rgba(77,195,247,.12)}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:16px;flex-shrink:0}
.main-header h1{margin:0;font-size:18px}
.main-body{flex:1;overflow-y:auto;padding:20px 24px}

/* ── Tabs / Grid / Cards ── */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:6px 16px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;font-family:inherit}
.tab.active{background:rgba(77,195,247,.2);border-color:rgba(77,195,247,.4);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.card-body{padding:12px;display:flex;flex-direction:column;gap:6px}
.card-volcano{font-size:14px;font-weight:600}
.card-meta{font-size:11px;color:rgba(255,255,255,.4)}
.card-actions{display:flex;gap:8px;margin-top:4px}
.btn-approve,.btn-reject,.btn-feature{flex:1;padding:8px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-approve{background:rgba(76,175,80,.2);color:#66bb6a}
.btn-approve:hover{background:rgba(76,175,80,.4)}
.btn-reject{background:rgba(244,67,54,.15);color:#ef5350}
.btn-reject:hover{background:rgba(244,67,54,.35)}
.btn-feature{background:rgba(255,200,50,.15);color:#ffc107}
.btn-feature:hover{background:rgba(255,200,50,.35)}
.btn-feature.active{background:rgba(255,200,50,.35);color:#fff}
.featured-badge{display:inline-block;background:rgba(255,200,50,.2);color:#ffc107;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.empty{text-align:center;color:rgba(255,255,255,.3);padding:60px 0;font-size:14px}
.status-msg{text-align:center;color:rgba(255,200,100,.8);padding:12px;font-size:13px}
.breadcrumb{font-size:12px;color:rgba(255,255,255,.4)}
.breadcrumb span{color:rgba(255,255,255,.7)}
</style>
</head>
<body>

<div class="login" id="login-section">
  <h1>照片审核后台</h1>
  <input type="password" id="admin-pwd" placeholder="管理员密码" />
  <button id="login-btn">登录</button>
  <div id="login-error" class="status-msg" style="display:none"></div>
</div>

<div class="admin-layout" id="admin-section" style="display:none">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🌋 火山目录</h2>
      <input type="text" class="sidebar-search" id="sidebar-search" placeholder="搜索火山…" autocomplete="off" />
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </div>

  <!-- Main -->
  <div class="main-content">
    <div class="main-header">
      <h1>照片审核后台</h1>
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
    <div class="main-body">
      <div class="tabs">
        <button class="tab active" data-status="pending">待审核</button>
        <button class="tab" data-status="approved">已通过</button>
        <button class="tab" data-status="rejected">已拒绝</button>
      </div>
      <div id="photo-grid" class="grid"></div>
    </div>
  </div>
</div>

<script type="module">
const SUPABASE_URL = 'https://kbighainzawljrmtxolw.supabase.co';
let adminKey = '';
let currentTab = 'pending';
let cachedPhotos = [];
let selectedVolcano = null;

document.getElementById('login-btn').addEventListener('click', tryLogin);
document.getElementById('admin-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

async function tryLogin() {
  adminKey = document.getElementById('admin-pwd').value;
  if (!adminKey) return;
  try {
    const res = await fetch('/api/admin/pending', { headers: { 'x-admin-key': adminKey } });
    if (!res.ok) throw new Error('密码错误');
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-section').style.display = 'flex';
    loadPhotos('pending');
  } catch (e) {
    const el = document.getElementById('login-error');
    el.textContent = e.message;
    el.style.display = 'block';
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.status;
    selectedVolcano = null;
    document.getElementById('sidebar-search').value = '';
    loadPhotos(currentTab);
  });
});

document.getElementById('sidebar-search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.sidebar-item[data-volcano]').forEach(el => {
    el.style.display = el.dataset.volcano.toLowerCase().includes(q) ? '' : 'none';
  });
});

function buildSidebar(data) {
  const list = document.getElementById('sidebar-list');
  const volcanoMap = new Map();
  data.forEach(p => {
    volcanoMap.set(p.volcano_id, (volcanoMap.get(p.volcano_id) || 0) + 1);
  });
  const sorted = [...volcanoMap.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  let html = `<div class="sidebar-item${selectedVolcano === null ? ' active' : ''}" data-volcano-all>
    <span class="item-icon">📁</span><span class="item-name">全部火山</span>
    <span class="item-count">${data.length}</span></div>`;
  sorted.forEach(([name, count]) => {
    html += `<div class="sidebar-item${selectedVolcano === name ? ' active' : ''}" data-volcano="${name}">
      <span class="item-icon">🌋</span><span class="item-name">${name}</span>
      <span class="item-count">${count}</span></div>`;
  });
  list.innerHTML = html;

  list.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', () => {
      if (el.hasAttribute('data-volcano-all')) {
        selectedVolcano = null;
      } else {
        selectedVolcano = el.dataset.volcano;
      }
      list.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      applyFilter();
      updateBreadcrumb();
    });
  });
  updateBreadcrumb();
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (selectedVolcano) {
    bc.innerHTML = `全部火山 / <span>${selectedVolcano}</span>`;
  } else {
    bc.innerHTML = '';
  }
}

function applyFilter() {
  const filtered = selectedVolcano
    ? cachedPhotos.filter(p => p.volcano_id === selectedVolcano)
    : cachedPhotos;
  renderPhotos(filtered, currentTab);
}

function renderPhotos(data, status) {
  const grid = document.getElementById('photo-grid');
  if (!data.length) { grid.innerHTML = '<div class="empty">暂无照片</div>'; return; }
  grid.innerHTML = data.map(p => `
    <div class="card" data-id="${p.id}">
      <img src="${SUPABASE_URL}/storage/v1/object/public/volcano-photos/${p.image_path}" />
      <div class="card-body">
        <div class="card-volcano">${p.volcano_id} ${p.is_featured ? '<span class="featured-badge">⭐ 封面</span>' : ''}</div>
        <div class="card-meta">上传者: ${p.uploader_id} · ${new Date(p.created_at).toLocaleString('zh-CN')}</div>
        ${status === 'pending' ? `<div class="card-actions">
          <button class="btn-approve" onclick="reviewPhoto('${p.id}','approved')">通过</button>
          <button class="btn-reject" onclick="reviewPhoto('${p.id}','rejected')">拒绝</button>
        </div>` : ''}
        ${status === 'approved' ? `<div class="card-actions">
          <button class="btn-feature${p.is_featured ? ' active' : ''}" onclick="setFeatured('${p.id}','${p.volcano_id}')">${p.is_featured ? '✓ 已设为封面' : '⭐ 设为封面'}</button>
        </div>` : ''}
      </div>
    </div>`).join('');
}

async function loadPhotos(status) {
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const res = await fetch(`/api/admin/pending?status=${status}`, { headers: { 'x-admin-key': adminKey } });
    const data = await res.json();
    cachedPhotos = data;
    buildSidebar(data);
    applyFilter();
  } catch (e) {
    grid.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
  }
}

window.setFeatured = async function(id, volcanoId) {
  try {
    const res = await fetch('/api/admin/feature', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
      body: JSON.stringify({ id, volcano_id: volcanoId }),
    });
    if (!res.ok) throw new Error('操作失败');
    loadPhotos('approved');
  } catch (e) {
    alert(e.message);
  }
};

window.reviewPhoto = async function(id, status) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  try {
    const res = await fetch('/api/admin/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
      body: JSON.stringify({ id, status }),
    });
    if (!res.ok) throw new Error('操作失败');
    if (card) card.remove();
    const remaining = document.querySelectorAll('.card');
    if (!remaining.length) document.getElementById('photo-grid').innerHTML = '<div class="empty">暂无照片</div>';
  } catch (e) {
    alert(e.message);
  }
};
</script>
</body>
</html>
